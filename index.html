  <script>
    // =========================================================================
    // 1. SUPABASE CLOUD DATABASE + STORAGE + AUTO-BACKUP CONFIGURATION
    // =========================================================================
    const SUPABASE_URL = 'https://vncglehzpctlfzupzatl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XbXyPRW4ebp5VfjrwqbCww_yriC5Vul';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const STORAGE_KEY = 'juftlik_makoni_db_v3';

    let emailJsConfig = {
      serviceId: '',
      templateId: '',
      publicKey: ''
    };

    let usersDB = [];
    let currentUserId = null;
    let activeSpaceKey = null;
    let cloudSyncInterval = null;

    let pendingRegOtp = '';

    let coupleQuestions = [
      {
        q: 'Birinchi uchrashuvimizdagi eng esda qolgan lahza qaysi?',
        answers: {}
      },
      {
        q: 'Kelajakda birga qaysi shaharga sayohat qilishni xohlaysan?',

    function computeSpaceKey(userObj) {
      if (!userObj) return 'default_space';
      if (userObj.space_key) return userObj.space_key;
      if (userObj.partnerId) {
        return [userObj.id, userObj.partnerId].sort().join('__');
      }
      return 'solo__' + userObj.id;
    }

    function mapDbUserToLocal(row) {
      return {
        id: row.id,
        firstName: row.first_name,
        lastName: row.last_name,
        email: row.email,
        username: row.username,
        password: row.password,
        inviteCode: row.invite_code,
        partnerId: row.partner_id || null,
        space_key: row.space_key || null
      };
    }

    async function fetchCloudUsers() {
      if (!sbClient) return;
      try {
        const { data, error } = await sbClient.from('app_users').select('*');
        if (!error && Array.isArray(data)) {
          usersDB = data.map(mapDbUserToLocal);
        }
      } catch (e) {
        console.warn('Cloud users fetch:', e);
      }
    }

    async function upsertCloudUser(u) {
      if (!sbClient || !u) return;
      try {
        await sbClient.from('app_users').upsert({
          id: u.id,
          first_name: u.firstName,
          last_name: u.lastName,
          email: u.email,
          username: u.username,
          password: u.password,
          invite_code: u.inviteCode,
          partner_id: u.partnerId || null,
          space_key: computeSpaceKey(u)
        });
      } catch (e) {
        console.warn('Cloud user upsert:', e);
      }
    }

    async function pushCloudSpaceSnapshot() {
      const me = getCurrentUser();
      if (!sbClient || !me) return;
      activeSpaceKey = computeSpaceKey(me);
      const payload = {
        relationshipStart: relationshipStart.toISOString(),
        scores,
        moods,
        galleryItems: galleryItems.filter(g => !g.src.startsWith('data:image/') || g.src.length < 40000),
        playlists,
        sharedIdeas,
        chatMessages,
        coupleQuestions
      };
      try {
        await sbClient.from('couple_spaces').upsert({
          space_key: activeSpaceKey,
          payload,
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.warn('Cloud space push:', e);
      }
    }

    async function pullCloudSpaceSnapshot(silent = false) {
      const me = getCurrentUser();
      if (!sbClient || !me) return;
      await fetchCloudUsers();
      const freshMe = getCurrentUser();
      if (!freshMe) return;
      activeSpaceKey = computeSpaceKey(freshMe);

      try {
        const { data, error } = await sbClient
          .from('couple_spaces')
          .select('payload')
          .eq('space_key', activeSpaceKey)
          .maybeSingle();

        if (!error && data && data.payload && Object.keys(data.payload).length > 0) {
          const p = data.payload;
          if (p.relationshipStart) relationshipStart = new Date(p.relationshipStart);
          if (p.scores) scores = p.scores;
          if (p.moods) moods = p.moods;
          if (Array.isArray(p.galleryItems) && p.galleryItems.length > 0) galleryItems = p.galleryItems;
          if (p.playlists) playlists = p.playlists;
          if (Array.isArray(p.sharedIdeas)) sharedIdeas = p.sharedIdeas;
          if (Array.isArray(p.chatMessages)) chatMessages = p.chatMessages;
          if (Array.isArray(p.coupleQuestions)) coupleQuestions = p.coupleQuestions;

          if (!document.getElementById('mainApp').classList.contains('hidden')) {
            syncActivePartnerUI();
            renderGallery();
            renderPlaylistTracks();
            renderIdeas();
            renderChatMessages();
            renderDailyQuestion();
          }
          if (!silent) showToast('Bulutli baza bilan sinxronlandi!', '☁️');
        }
      } catch (e) {
        console.warn('Cloud space pull:', e);
      }
    }

    function startCloudRealtimeSync() {
      clearInterval(cloudSyncInterval);
      cloudSyncInterval = setInterval(() => {
        if (currentUserId && !document.getElementById('mainApp').classList.contains('hidden')) {
          pullCloudSpaceSnapshot(true);
        }
      }, 4500);
    }

    async function uploadFileToSupabaseStorage(file, folderName) {
      if (!sbClient || !file) return null;
      try {
        const ext = file.name.split('.').pop() || 'bin';
        const safePath = `${folderName}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error } = await sbClient.storage
          .from('couple-media')
          .upload(safePath, file, { cacheControl: '3600', upsert: false });
        if (error) return null;
        const { data } = sbClient.storage.from('couple-media').getPublicUrl(safePath);
        return data ? data.publicUrl : null;
      } catch (e) {
        return null;
      }
    }

    // =========================================================================
    // CONTINUOUS AUTO-BACKUP & MANUAL EXPORT/RESTORE
    // =========================================================================
    function persistAutoBackup(syncToCloud = true) {
      try {
        const snapshot = {
          version: 3,
          updatedAt: new Date().toISOString(),
          emailJsConfig,
          usersDB,
          relationshipStart: relationshipStart.toISOString(),
          scores,
          moods,
          galleryItems,
          playlists,
          sharedIdeas,
          chatMessages,
          coupleQuestions
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        const lbl = document.getElementById('lastBackupTimeLabel');
        if (lbl) {
          const now = new Date();
          lbl.textContent = `Bulut + Lokal: ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        if (syncToCloud && currentUserId) {
          pushCloudSpaceSnapshot();
        }
      } catch (e) {
        console.warn('Auto-backup storage note:', e);
      }
    }
// ... existing code ...
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const username = document.getElementById('regUsername').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value.trim();
      const err = document.getElementById('regErrorMsg');

      if (pendingRegOtp) {
        const enteredOtp = document.getElementById('regOtpInput').value.trim();
        if (enteredOtp !== pendingRegOtp) {
          err.textContent = "Elektron pochtaga yuborilgan tasdiqlash kodi noto'g'ri!";
          err.classList.remove('hidden');
          return;
        }
      }

      await fetchCloudUsers();

      if (usersDB.some(u => u.username === username || u.email === email)) {
        err.textContent = "Bu login yoki elektron pochta allaqachon ro'yxatdan o'tgan!";
        err.classList.remove('hidden');
        return;
      }

      const inviteCode = 'LOVE-' + Math.floor(1000 + Math.random() * 9000);
      const newUser = {
        id: 'u_' + Date.now(),
        firstName,
        lastName,
        email,
        username,
        password,
        inviteCode,
        partnerId: null
      };

      usersDB.push(newUser);
      currentUserId = newUser.id;
      pendingRegOtp = '';
      err.classList.add('hidden');
      await upsertCloudUser(newUser);
      persistAutoBackup(true);

      openPairingScreen();
      showToast(`Profil yaratildi va bulutga saqlandi!`, '☁️');
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const ident = document.getElementById('loginIdentifier').value.trim().toLowerCase();
      const pass = document.getElementById('loginPassword').value.trim();
      const err = document.getElementById('loginErrorMsg');

      await fetchCloudUsers();

      const found = usersDB.find(
        u => (u.username === ident || u.email === ident) && u.password === pass
      );

      if (!found) {
        err.textContent = usersDB.length === 0
          ? "Hali profil ochilmagan. Avval «Yangi profil ochish» bo'limidan ro'yxatdan o'ting!"
          : "Login/pochta yoki parol noto'g'ri!";
        err.classList.remove('hidden');
        return;
      }

      currentUserId = found.id;
      err.classList.add('hidden');
      await pullCloudSpaceSnapshot(true);
      if (found.partnerId) {
        enterWorkspaceSoloOrPaired();
      } else {
        openPairingScreen();
      }
      showToast(`Xush kelibsiz, ${found.firstName}!`, '🩵');
    });
// ... existing code ...

      const code = document.getElementById('verifyCodeInput').value.trim();

      if (code !== pendingRecoveryCode) {
        showToast("Tasdiqlash kodi noto'g'ri!", '⚠️');

      }

        return;
      }
      const user = usersDB.find(u => u.id === recoveryTargetUserId);

        user.password = newPass;

        document.getElementById('loginIdentifier').value = user.email;
        showToast("Parol bulutda muvaffaqiyatli yangilandi!", '✅');

    }
// ... existing code ...
    async function linkUsersByCode(codeStr) {
      const me = getCurrentUser();
      if (!me) return { ok: false, msg: 'Foydalanuvchi topilmadi' };
      await fetchCloudUsers();
      const cleanCode = codeStr.trim().toUpperCase();
      if (cleanCode === me.inviteCode) {
        return { ok: false, msg: "O'zingizning kodingizni emas, juftingiz kodini kiriting!" };
      }
      const partner = usersDB.find(u => u.inviteCode === cleanCode);
      if (!partner) {
        return { ok: false, msg: "Bunday Juftlik Kodi topilmadi! Juftingiz ham ro'yxatdan o'tganiga ishonch hosil qiling." };
      }
      me.partnerId = partner.id;
      partner.partnerId = me.id;
      const sharedKey = [me.id, partner.id].sort().join('__');
      me.space_key = sharedKey;
      partner.space_key = sharedKey;

      await upsertCloudUser(me);
      await upsertCloudUser(partner);
      persistAutoBackup(true);
      return { ok: true, partner };
    }

    async function connectWithPartnerCode() {
      const val = document.getElementById('partnerInviteCodeInput').value;
      const errEl = document.getElementById('pairingErrorMsg');
      const res = await linkUsersByCode(val);
      if (!res.ok) {
        errEl.textContent = res.msg;
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');
      await pullCloudSpaceSnapshot(true);
      enterWorkspaceSoloOrPaired();
      showToast(`${res.partner.firstName} bilan juftlik makoni birlashtirildi!`, '🩵');
    }

    async function enterWorkspaceSoloOrPaired() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('pairingScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      await pullCloudSpaceSnapshot(true);
      syncActivePartnerUI();
      startCloudRealtimeSync();
    }

    function logoutApp() {
      stopAudioPlayback();
      clearInterval(cloudSyncInterval);
      currentUserId = null;
      document.getElementById('loginPassword').value = '';
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('pairingScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
      switchAuthMode('login');
    }

    function openPhotoUploadModal() {
      pendingUploadDataUrl = null;
      pendingPhotoFileObj = null;
      document.getElementById('uploadPreviewBox').classList.add('hidden');
      document.getElementById('uploadPhotoCaption').value = '';
      openModal('photoUploadModal');

    function handlePhotoFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      pendingPhotoFileObj = file;
      const reader = new FileReader();
      reader.onload = function (e) {
        pendingUploadDataUrl = e.target.result;
        document.getElementById('uploadPreviewImg').src = pendingUploadDataUrl;
        document.getElementById('uploadPreviewBox').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    async function confirmPhotoUpload() {
      const album = document.getElementById('uploadPhotoAlbum').value;
      const caption = document.getElementById('uploadPhotoCaption').value.trim() || 'Yangi unutilmas xotira 🩵';

      let imgSrc = pendingUploadDataUrl || createSkyArtSvg(album, caption.slice(0, 26), '📸');
      if (pendingPhotoFileObj) {
        showToast('Rasm bulutli omborga yuklanmoqda...', '☁️');
        const cloudUrl = await uploadFileToSupabaseStorage(pendingPhotoFileObj, 'photos');
        if (cloudUrl) imgSrc = cloudUrl;
      }

      galleryItems.unshift({
        id: Date.now(),
        album,
        caption,
        author: getActiveAuthorLabel(),
        likes: 1,
        src: imgSrc
      });

      closeModal('photoUploadModal');
      renderGallery();
      persistAutoBackup(true);
      showToast('Rasm ikkala telefon uchun yuklandi!', '🖼️');
    }

    async function confirmDirectAudioUpload() {
      if (!pendingAudioFileObj) {
        showToast('Avval audio faylni tanlang!', '⚠️');
        return;
      }
      const title = document.getElementById('uploadSongTitleInput').value.trim() || pendingAudioFileObj.name.replace(/\.[^/.]+$/, '');
      const targetTab = document.getElementById('uploadAudioTargetPlaylist').value;
      const alsoShared = document.getElementById('alsoAddToSharedCheckbox').checked;

      showToast('MP3 bulutga yuklanmoqda...', '☁️');
      const cloudAudioUrl = await uploadFileToSupabaseStorage(pendingAudioFileObj, 'music');
      const url = cloudAudioUrl || URL.createObjectURL(pendingAudioFileObj);

      const newTrack = {
        id: Date.now(),
        title,
        artist: 'Yuklangan MP3',
        author: getActiveAuthorLabel(),
        freqNotes: null,
        audioUrl: url
      };

      playlists[targetTab].unshift(newTrack);

      if (alsoShared && targetTab !== 'shared') {
        playlists.shared.unshift({
          ...newTrack,
          id: Date.now() + 1
        });
      }

      closeModal('audioUploadModal');
      persistAutoBackup(true);
      switchPlaylistTab(targetTab);
      playTrack(newTrack);
      showToast('Musiqa bulutga yuklandi!', '🎵');
    }
